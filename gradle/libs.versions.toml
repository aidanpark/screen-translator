[versions]
androidGradlePlugin = "9.4.1"
googleServices = "4.5.0"
firebaseCrashlytics = "3.0.8"
kotlin = "2.3.21"
ksp = "2.3.12"
hilt = "2.60.1"
composeBom = "2026.06.01"

admob = "25.4.0"
review = "2.0.2"

androidxLifecycle = "2.11.0"
constraintlayout = "1.1.2"
dynamicanimation = "1.1.0"

annotation = "1.10.0"

datastore = "1.2.1"
hiltLifecycleViewModelCompose = "1.4.0"

kotlinxCoroutines = "1.11.0"

workRuntime = "2.8.1"

material = "1.14.0"

# 번들 OCR은 제거(앱 크기 절감). GMS(언번들) OCR로 전환 — 모델은 Play 서비스가 런타임에 내려받음.
mlkitGmsTextRecognition = "19.0.1"
mlkitGmsTextRecognitionScript = "16.0.1"
mlkitLanguageId = "17.0.6"

deepl = "1.7.0"

firebaseBom = "34.17.0"

gson = "2.14.0"
retrofit2 = "2.11.0"
# 앱이 OkHttp 코어 API를 직접 사용하므로 명시적으로 선언(과거엔 Coil이 전이로 4.x를 끌어왔음)
okhttp = "4.12.0"
reorderable = "2.4.2"

timber = "5.0.1"

junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
androidxTestRunner = "1.7.0"
monitor = "1.8.0"


[plugins]
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
google-firebase-crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "firebaseCrashlytics" }
android-library = { id = "com.android.library", version.ref = "androidGradlePlugin" }
android-asset-pack = { id = "com.android.asset-pack", version.ref = "androidGradlePlugin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }


[libraries]
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
onnxruntime-android = { group = "com.microsoft.onnxruntime", name = "onnxruntime-android", version = "1.21.1" }
play-asset-delivery = { group = "com.google.android.play", name = "asset-delivery-ktx", version = "2.3.0" }
admob = { group = "com.google.android.gms", name = "play-services-ads", version.ref = "admob" }
app-review = { group = "com.google.android.play", name = "review-ktx", version.ref = "review" }
#app-update = { group = "com.google.android.play", name = "app-update-ktx", version.ref = "appUpdate" }

androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-service = { group = "androidx.lifecycle", name = "lifecycle-service", version.ref = "androidxLifecycle" }

androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" } # composeBom
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" } # composeBom
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" } # composeBom
androidx-constraintlayout-compose = { group = "androidx.constraintlayout", name = "constraintlayout-compose", version.ref = "constraintlayout" }
androidx-dynamicanimation = { module = "androidx.dynamicanimation:dynamicanimation", version.ref = "dynamicanimation" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation" } # composeBom

androidx-annotation = { group = "androidx.annotation", name = "annotation", version.ref = "annotation" }

androidx-datastore = { group = "androidx.datastore", name = "datastore", version.ref = "datastore" }
androidx-datastore-core = { group = "androidx.datastore", name = "datastore-core", version.ref = "datastore" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

dagger-hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
dagger-hilt-android-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
androidx-hilt-lifecycle-viewmodel-compose = { module = "androidx.hilt:hilt-lifecycle-viewmodel-compose", version.ref = "hiltLifecycleViewModelCompose" }

kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }

androidx-work-runtime = { group = "androidx.work", name = "work-runtime", version.ref = "workRuntime" }

material = { group = "com.google.android.material", name = "material", version.ref = "material" }
material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" } # composeBom

google-gms-mlkit-text-recognition = { module = "com.google.android.gms:play-services-mlkit-text-recognition", version.ref = "mlkitGmsTextRecognition" }
google-gms-mlkit-text-recognition-chinese = { module = "com.google.android.gms:play-services-mlkit-text-recognition-chinese", version.ref = "mlkitGmsTextRecognitionScript" }
google-gms-mlkit-text-recognition-devanagari = { module = "com.google.android.gms:play-services-mlkit-text-recognition-devanagari", version.ref = "mlkitGmsTextRecognitionScript" }
google-gms-mlkit-text-recognition-japanese = { module = "com.google.android.gms:play-services-mlkit-text-recognition-japanese", version.ref = "mlkitGmsTextRecognitionScript" }
google-gms-mlkit-text-recognition-korean = { module = "com.google.android.gms:play-services-mlkit-text-recognition-korean", version.ref = "mlkitGmsTextRecognitionScript" }
google-mlkit-language-id = { module = "com.google.mlkit:language-id", version.ref = "mlkitLanguageId" }
#google-gms-mlkit-language-id = { module = "com.google.android.gms:play-services-mlkit-language-id", version.ref = "mlkitLanguageId" }

deepl-api = { group = "com.deepl.api", name = "deepl-java", version.ref = "deepl" }

firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-analytics = { group = "com.google.firebase", name = "firebase-analytics" }
firebase-appcheck = { group = "com.google.firebase", name = "firebase-appcheck" }
firebase-appcheck-playintegrity = { group = "com.google.firebase", name = "firebase-appcheck-playintegrity" }
firebase-crashlytics = { group = "com.google.firebase", name = "firebase-crashlytics" }
firebase-config = { group = "com.google.firebase", name = "firebase-config" }

gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
squareup-retrofit2-retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit2" }
squareup-retrofit2-converter-gson = { group = "com.squareup.retrofit2", name = "converter-gson", version.ref = "retrofit2" }
squareup-okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
reorderable = { module = "sh.calvin.reorderable:reorderable", version.ref = "reorderable" }

timber = { group = "com.jakewharton.timber", name = "timber", version.ref = "timber" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-monitor = { group = "androidx.test", name = "monitor", version.ref = "monitor" }


[bundles]
